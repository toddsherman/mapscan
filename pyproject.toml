[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mapscan-processor"
version = "0.1.0"
description = "Experimental alignment and extraction pipeline for MapScan"
requires-python = ">=3.9"
dependencies = [
  "matplotlib==3.9.4",
  "mapbox-vector-tile==2.2.0",
  "numpy==1.26.4",
  "opencv-python-headless==4.10.0.84",
  "pdfplumber==0.11.7",
  "Pillow==11.3.0",
  "pyproj==3.6.1",
  "pyshp==2.3.1",
  "scipy==1.13.1",
  "shapely==2.0.7",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[project.scripts]
mapscan = "mapscan.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
